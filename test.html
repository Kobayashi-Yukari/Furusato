<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いいねボタン</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <button id="likeButton">いいね</button>
    <p id="likeCount">Likes buttonの数: 0</p>

    <script src="script.js"></script>
</body>
</html>
<script>
    $(document).ready(function() {
    // いいねのカウントを初期化
    let likeCount = 0;

    // ボタンがクリックされたときのイベントリスナーを追加
    $('#likeButton').on('click', function() {
        // いいねのカウントを増加
        likeCount++;
        
        // カウントを表示する要素を更新
        $('#likeCount').text(`いいねの数: ${likeCount}`);
    });
});
</script>
